<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحقق من تصريح أجير</title></head><body><p>جاري فتح صفحة التحقق...</p><script>
(function(){const p=new URLSearchParams(location.search);let id=p.get("id")||"";const num=p.get("num")||"",ref=p.get("ref")||"",type=p.get("type")||"";if(!id){const a=location.pathname.split("/").filter(Boolean),last=a[a.length-1]||"";if(last&&!["index.html","view","verify.htm","verify.html","add-verify.html"].includes(last))id=last;}if(!id){document.body.textContent="رابط التحقق غير مكتمل: رقم التصريح غير موجود.";return;}const base=location.pathname.startsWith("/view/")?"/view/":"/";const page=type==="add"?"add-verify.html":"verify.html";const u=new URL(base+"ajeer/"+page,location.origin);u.searchParams.set("id",id);if(num)u.searchParams.set("num",num);if(ref)u.searchParams.set("ref",ref);if(type)u.searchParams.set("type",type);location.replace(u.toString());})();
</script></body></html>
