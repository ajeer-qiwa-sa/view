
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>التحقق من تصريح أجير</title>
</head>
<body>
  <p id="message">جاري فتح صفحة التحقق...</p>

  <script>
  (function () {
    "use strict";

    const message = document.getElementById("message");
    const params = new URLSearchParams(window.location.search);

    const parts = window.location.pathname
      .split("/")
      .filter(Boolean);

    const reserved = new Set([
      "view",
      "index.html",
      "404.html",
      "verify.htm",
      "verify.html",
      "add-verify.html",
      "blocked.html",
      "add",
      "additional",
      "extra",
      "blocked"
    ]);

    // Extract ID from query or URL path
    let pathId = "";

    for (let i = parts.length - 1; i >= 0; i--) {
      let segment;

      try {
        segment = decodeURIComponent(parts[i]).trim();
      } catch (error) {
        message.textContent = "رابط التحقق غير صالح.";
        return;
      }

      if (!reserved.has(segment.toLowerCase())) {
        pathId = segment;
        break;
      }
    }

    const id = (params.get("id") || pathId).trim();
    const num = (params.get("num") || "").trim();
    const type = (params.get("type") || "")
      .trim()
      .toLowerCase();

    // Determine verification page
    const pathTypes = parts.map(function (part) {
      return part.toLowerCase();
    });

    const isAdditional =
      ["add", "additional", "extra"].includes(type) ||
      pathTypes.some(function (part) {
        return [
          "add",
          "additional",
          "extra",
          "add-verify.html"
        ].includes(part);
      });

    const isBlocked =
      type === "blocked" ||
      pathTypes.some(function (part) {
        return [
          "blocked",
          "blocked.html"
        ].includes(part);
      });

    if (!id && !num) {
      message.textContent =
        "رابط التحقق غير مكتمل: رقم التصريح غير موجود.";
      return;
    }

    const page = isBlocked
      ? "blocked.html"
      : isAdditional
        ? "add-verify.html"
        : "verify.html";

    const target = new URL(
      "/ajeer/" + page,
      "https://ajeer-dashboard.vercel.app"
    );

    // Preserve original parameters
    params.forEach(function (value, key) {
      if (key.toLowerCase() !== "id") {
        target.searchParams.append(key, value);
      }
    });

    if (id) {
      target.searchParams.set("id", id);
    }

    // Redirect to verification page
    window.location.replace(target.toString());

  })();
  </script>
</body>
</html>
