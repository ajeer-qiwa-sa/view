
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التحقق من تصريح أجير</title>
</head>
<body>
  <p id="message">جاري فتح صفحة التحقق...</p>

  <script>
  (function () {
    "use strict";

    const params = new URLSearchParams(location.search);
    const parts = location.pathname.split("/").filter(Boolean);

    const reserved = [
      "index.html",
      "404.html",
      "view",
      "verify.htm",
      "verify.html",
      "add-verify.html",
      "blocked.html",
      "add",
      "blocked"
    ];

    const last = decodeURIComponent(
      parts[parts.length - 1] || ""
    );

    const id = (
      params.get("id") ||
      (!reserved.includes(last.toLowerCase()) ? last : "")
    ).trim();

    const num = (params.get("num") || "").trim();
    const ref = (params.get("ref") || "").trim();
    const type = (params.get("type") || "").trim().toLowerCase();

    if (!id && !num) {
      document.getElementById("message").textContent =
        "رابط التحقق غير مكتمل: رقم التصريح غير موجود.";
      return;
    }

    const path = location.pathname.toLowerCase();

    const additional =
      ["add", "additional", "extra"].includes(type) ||
      /\/add(?:-verify\.html?)?\/?$/.test(path);

    const blocked =
      type === "blocked" ||
      /\/blocked(?:\.html?)?\/?$/.test(path);

    const page = blocked
      ? "blocked.html"
      : additional
        ? "add-verify.html"
        : "verify.html";

    const target = new URL(
      "https://ajeervercel.vercel.app/ajeer/" + page
    );

    if (id) target.searchParams.set("id", id);
    if (num) target.searchParams.set("num", num);
    if (ref) target.searchParams.set("ref", ref);

    ["type", "gender"].forEach(function (key) {
      const value = params.get(key);
      if (value) target.searchParams.set(key, value);
    });

    location.replace(target.toString());
  })();
  </script>
</body>
</html>
