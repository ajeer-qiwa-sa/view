<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التحقق من تصريح أجير</title>
</head>
<body>
  <p id="message">جاري فتح صفحة التحقق...</p>
  <script>
  (function () {
    "use strict";
    const params = new URLSearchParams(location.search);
    const parts = location.pathname.split("/").filter(Boolean);
    const last = parts[parts.length - 1] || "";
    const reserved = ["index.html", "404.html", "view", "verify.htm", "verify.html", "add-verify.html"];
    const id = (params.get("id") || (!reserved.includes(last) ? last : "")).trim();
    if (!id) {
      document.getElementById("message").textContent =
        "رابط التحقق غير مكتمل: رقم التصريح غير موجود.";
      return;
    }
    const type = (params.get("type") || "").trim().toLowerCase();
    const additional = ["add", "additional", "extra"].includes(type) ||
      /\/add-verify\.html?$/.test(location.pathname);
    const page = additional ? "add-verify.html" : "verify.html";
    const target = new URL("https://ajeer-qiwa-sa.asia/ajeer/" + page);
    target.searchParams.set("id", id);
    ["num", "ref", "type", "gender"].forEach(function (key) {
      const value = params.get(key);
      if (value !== null && value !== "") target.searchParams.set(key, value);
    });
    location.replace(target.toString());
  })();
  </script>
</body>
</html>
