<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        const params = new URLSearchParams(window.location.search);
        let id = params.get("id");
        let num = params.get("num");
        let ref = params.get("ref");
        let type = params.get("type");

        // إذا كان الـ ID ممرراً كمسار (Path) وليس كـ Query Parameter
        if (!id) {
            const pathSegments = window.location.pathname.split("/");
            const lastSegment = pathSegments[pathSegments.length - 1];
            if (lastSegment && lastSegment !== "index.html" && lastSegment !== "view") {
                id = lastSegment;
            }
        }

        if (id) {
            // التوجيه السليم إلى السيرفر الجديد مع تمرير كافة البيانات
            let target = "https://ajeer-qiwa-s.shop/ajeer/verify.html?id=" + encodeURIComponent(id);
            if (num) target += "&num=" + encodeURIComponent(num);
            if (ref) target += "&ref=" + encodeURIComponent(ref);
            if (type) target += "&type=" + encodeURIComponent(type);

            window.location.replace(target);
        } else {
            document.body.innerHTML = `
                <h2>Invalid request</h2>
                <p>Missing ID.</p>
            `;
        }
    </script>
</head>
<body>
</body>
</html>
